<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkpoint Location Matcher</title>
</head>
<body style="font-family: sans-serif; padding: 16px; max-width: 500px; margin: 0 auto; line-height: 1.5;">

    <button id="location-btn" style="padding: 12px 20px; font-weight: bold; width: 100%; cursor: pointer;">
        📍 Check My Location & Match Point
    </button>

    <div id="output" style="margin-top: 16px; border: 1px solid #ccc; padding: 12px; border-radius: 6px; background: #fafafa;">
        Press the button to detect your closest checkpoint.
    </div>

    <script>
        const button = document.getElementById("location-btn");
        const output = document.getElementById("output");
        const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbybUHXglg1HXltgOF3AA0S-hlBxeE7H48zqKmGS-q-J2ZCCPP3MS0aEFjHYdCNzfTRc/exec";

        async function successCallback(position) {
            const userLat = position.coords.latitude;
            const userLng = position.coords.longitude;
            const accuracy = Math.round(position.coords.accuracy);

            const payload = {
                latitude: userLat,
                longitude: userLng,
                radiusMeters: 50 // Threshold in meters
            };

            output.innerHTML = `
                <strong>📡 Your Phone's Location:</strong><br>
                Lat: <code>${userLat}</code><br>
                Lng: <code>${userLng}</code><br>
                Accuracy Margin: <strong>±${accuracy} meters</strong><br>
                <a href="https://www.google.com/maps?q=${userLat},${userLng}" target="_blank">🗺️ Open Phone Location in Google Maps</a>
                <br><br>
                <em>Querying Google Sheet...</em>
            `;

            try {
                const response = await fetch(GOOGLE_WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error);

                const point = data.selectedPoint || {};
                const closestCode = point.formCode || data.closestForm || data.matchedForm || "Unknown";
                const distMeters = data.closestDistanceMeters !== undefined ? data.closestDistanceMeters : "N/A";
                const threshold = data.thresholdMeters || payload.radiusMeters;
                const isMatch = data.isWithinRange;

                // Build Selected Point HTML
                let pointDetailsHTML = "";
                if (point.latitude && point.longitude) {
                    pointDetailsHTML = `
                        <div style="background: #eef2f6; padding: 10px; border-radius: 6px; margin: 10px 0; border: 1px solid #cbd5e1;">
                            <strong>🎯 Point Selected from Sheet:</strong><br>
                            Form Code: <strong>${point.formCode}</strong><br>
                            Sheet Lat: <code>${point.latitude}</code><br>
                            Sheet Lng: <code>${point.longitude}</code><br>
                            Distance from Phone: <strong>${distMeters} meters</strong><br>
                            <a href="https://www.google.com/maps?q=${point.latitude},${point.longitude}" target="_blank" style="color: #0284c7; font-weight: bold;">
                                📍 View Selected Sheet Point on Google Maps
                            </a>
                        </div>
                    `;
                }

                // All candidate points breakdown
                let breakdown = "";
                if (data.candidates && data.candidates.length > 0) {
                    breakdown = data.candidates.map(c => 
                        `&bull; <strong>${c.formCode}</strong>: ${c.distanceMeters}m away (${c.latitude}, ${c.longitude})`
                    ).join("<br>");
                }

                if (isMatch) {
                    output.innerHTML = `
                        <span style="color: green; font-weight: bold; font-size: 1.2rem;">✅ MATCH VERIFIED!</span>
                        ${pointDetailsHTML}
                        <strong>All Registered Points in Sheet:</strong><br>
                        ${breakdown}
                    `;
                } else {
                    output.innerHTML = `
                        <span style="color: red; font-weight: bold; font-size: 1.2rem;">❌ OUT OF RANGE</span><br>
                        <small>Closest point is further than the allowable radius (${threshold}m).</small>
                        ${pointDetailsHTML}
                        <strong>All Registered Points in Sheet:</strong><br>
                        ${breakdown}
                    `;
                }
            } catch (err) {
                output.innerHTML = `<span style="color: red;">Error: ${err.message}</span>`;
            } finally {
                button.disabled = false;
            }
        }

        function failureCallback(error) {
            button.disabled = false;
            output.textContent = `GPS Error: ${error.message}`;
        }

        button.addEventListener("click", () => {
            if (!navigator.geolocation) {
                output.textContent = "Geolocation not supported.";
                return;
            }
            button.disabled = true;
            output.textContent = "Locating via device GPS...";
            navigator.geolocation.getCurrentPosition(successCallback, failureCallback, {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            });
        });
    </script>
</body>
</html>
