
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Location Form Code Detector</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .container {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h2 {
      color: #202124;
      margin-top: 0;
    }

    p {
      color: #666;
      line-height: 1.5;
    }

    button {
      background: #188038;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 15px 25px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      margin-top: 15px;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #output {
      margin-top: 25px;
      padding: 15px;
      border-radius: 8px;
      background: #f8f9fa;
      overflow-wrap: anywhere;
    }

    .success {
      color: #188038;
      font-weight: bold;
      font-size: 20px;
    }

    .error {
      color: #d93025;
      font-weight: bold;
    }

    .code {
      font-size: 30px;
      font-weight: bold;
      color: #188038;
      margin: 12px 0;
    }

    .details {
      font-size: 14px;
      color: #666;
      line-height: 1.8;
    }
  </style>
</head>

<body>

  <div class="container">

    <h2>Location Detection</h2>

    <p>
      Press the button below to detect your nearest
      registered form code.
    </p>

    <button id="location-btn" onclick="detectLocation()">
      📍 Detect My Location
    </button>

    <div id="output" aria-live="polite">
      Press the button to start.
    </div>

  </div>

  
<script>

const button = document.getElementById("location-btn");
const output = document.getElementById("output");

// Your Google Apps Script Web App URL
const GOOGLE_WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbybUHXglg1HXltgOF3AA0S-hlBxeE7H48zqKmGS-q-J2ZCCPP3MS0aEFjHYdCNzfTRc/exec";

// Matching radius in meters
const SEARCH_RADIUS = 50;

let requestTimeout = null;
let activeScript = null;

function showMessage(message, className = "") {
  output.className = className;
  output.textContent = message;
}

function detectLocation() {

  if (!navigator.geolocation) {
    showMessage(
      "Your browser does not support GPS.",
      "error"
    );
    return;
  }

  button.disabled = true;
  showMessage("Getting your current location...");

  navigator.geolocation.getCurrentPosition(
    successCallback,
    failureCallback,
    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }
  );
}


// GPS successfully retrieved
function successCallback(position) {

  const latitude = position.coords.latitude;
  const longitude = position.coords.longitude;

  showMessage("Connecting to Google Apps Script...");

  // Clean up any previous request
  cleanupRequest();

  // Create JSONP callback
  window.handleLocationResponse = function(data) {

    cleanupRequest();

    if (!data || !data.success) {
      showMessage(
        "Matching Error: " +
        (data?.error || "Invalid response"),
        "error"
      );
      return;
    }

    displayResult(data);
  };

  // Build API request URL
  const params = new URLSearchParams({
    latitude: latitude,
    longitude: longitude,
    radius: SEARCH_RADIUS,
    callback: "handleLocationResponse"
  });

  const script = document.createElement("script");

  activeScript = script;

  script.src = GOOGLE_WEB_APP_URL + "?" + params.toString();

  script.onerror = function() {
    cleanupRequest();

    showMessage(
      "Unable to connect to Google Apps Script. Check your deployment URL and access settings.",
      "error"
    );
  };

  requestTimeout = setTimeout(function() {
    cleanupRequest();

    showMessage(
      "Request timed out. Please try again.",
      "error"
    );
  }, 20000);

  document.body.appendChild(script);
}


// Clean up JSONP request
function cleanupRequest() {

  if (requestTimeout) {
    clearTimeout(requestTimeout);
    requestTimeout = null;
  }

  if (activeScript) {
    activeScript.remove();
    activeScript = null;
  }

  delete window.handleLocationResponse;
  button.disabled = false;
}


// Display matching result
function displayResult(data) {

  output.replaceChildren();

  if (data.isWithinRange) {

    const title = document.createElement("div");
    title.style.color = "#188038";
    title.style.fontWeight = "bold";
    title.style.fontSize = "22px";
    title.textContent = "✓ Match Verified!";

    const label = document.createElement("p");
    label.textContent = "Assigned Form Code:";

    const code = document.createElement("div");
    code.style.fontSize = "30px";
    code.style.fontWeight = "bold";
    code.style.color = "#188038";
    code.textContent = data.matchedForm;

    const distance = document.createElement("p");
    distance.textContent =
      "Distance: " + data.closestDistanceMeters + " meters";

    output.append(title, label, code, distance);

  } else {

    const title = document.createElement("div");
    title.style.color = "#d93025";
    title.style.fontWeight = "bold";
    title.textContent = "Outside Allowed Range";

    const details = document.createElement("p");
    details.textContent =
      "Closest form: " + data.closestForm +
      " | Distance: " + data.closestDistanceMeters +
      " meters" +
      " | Allowed: " + data.thresholdMeters + " meters";

    output.append(title, details);
  }
}


// GPS failure
function failureCallback(error) {

  button.disabled = false;

  const messages = {
    1: "Location permission denied. Please allow GPS access.",
    2: "GPS location is unavailable.",
    3: "GPS request timed out. Please try again."
  };

  showMessage(
    messages[error.code] || error.message,
    "error"
  );
}


// Connect button
button.addEventListener("click", detectLocation);

</script>


</body>
</html>
