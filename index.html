
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Patrol Checkpoint Verification</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f1f3f6;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      width: 100%;
      max-width: 440px;
      padding: 30px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h2 {
      color: #202124;
      margin-top: 0;
    }

    .description {
      color: #666;
      line-height: 1.6;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      border: none;
      border-radius: 9px;
      background: #188038;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #output {
      margin-top: 22px;
      padding: 18px;
      background: #f8f9fa;
      border-radius: 10px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .success {
      color: #188038;
      font-weight: bold;
    }

    .error {
      color: #d93025;
      font-weight: bold;
    }

    .form-code {
      font-size: 34px;
      font-weight: bold;
      color: #188038;
      margin: 12px 0;
    }

    .details {
      font-size: 13px;
      color: #666;
      margin-top: 10px;
    }

    .progress {
      color: #1967d2;
      font-weight: bold;
    }

    .small {
      font-size: 12px;
      color: #777;
      margin-top: 15px;
    }

  </style>

</head>

<body>

  <div class="container">

    <h2>Location Detection</h2>

    <p class="description">
      Reach the designated patrol location and press
      the button to verify your checkpoint.
    </p>

    <button id="location-btn">
      📍 Detect My Location
    </button>

    <div id="output" aria-live="polite">
      Ready to verify your patrol location.
    </div>

    <div class="small">
      Required GPS accuracy: 5 meters or better.
      <br>
      Maximum checkpoint distance: 5 meters.
    </div>

  </div>


<script>

// ======================================
// CONFIGURATION
// ======================================

const GOOGLE_WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbybUHXglg1HXltgOF3AA0S-hlBxeE7H48zqKmGS-q-J2ZCCPP3MS0aEFjHYdCNzfTRc/exec";

const MAX_GPS_ACCURACY = 5;

const MAX_WAIT_TIME = 60000;


// ======================================
// ELEMENTS
// ======================================

const button =
  document.getElementById("location-btn");

const output =
  document.getElementById("output");


// ======================================
// STATE
// ======================================

let watchId = null;
let gpsTimer = null;
let apiTimer = null;
let activeScript = null;

let isProcessing = false;


// ======================================
// DISPLAY MESSAGE
// ======================================

function showMessage(message, className = "") {

  output.className = className;
  output.textContent = message;

}


// ======================================
// CLEANUP GPS
// ======================================

function stopGPS() {

  if (watchId !== null) {

    navigator.geolocation.clearWatch(watchId);

    watchId = null;

  }

  if (gpsTimer !== null) {

    clearTimeout(gpsTimer);

    gpsTimer = null;

  }

}


// ======================================
// CLEANUP API
// ======================================

function cleanupAPI() {

  if (apiTimer !== null) {

    clearTimeout(apiTimer);

    apiTimer = null;

  }

  if (activeScript) {

    activeScript.remove();

    activeScript = null;

  }

  delete window.handleLocationResponse;

}


// ======================================
// RESET
// ======================================

function resetSystem() {

  stopGPS();

  cleanupAPI();

  isProcessing = false;

  button.disabled = false;

}


// ======================================
// START LOCATION DETECTION
// ======================================

function detectLocation() {

  if (isProcessing) return;

  if (!navigator.geolocation) {

    showMessage(
      "Your browser does not support GPS.",
      "error"
    );

    return;

  }

  resetSystem();

  isProcessing = true;

  button.disabled = true;

  showMessage(
    "Searching for an accurate GPS signal...",
    "progress"
  );

  gpsTimer = setTimeout(function() {

    stopGPS();

    showMessage(
      "GPS accuracy did not reach 5 meters within 60 seconds. Please move to an open area and try again.",
      "error"
    );

    isProcessing = false;

    button.disabled = false;

  }, MAX_WAIT_TIME);


  watchId = navigator.geolocation.watchPosition(

    successGPS,

    gpsError,

    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 60000
    }

  );

}


// ======================================
// GPS SUCCESS
// ======================================

function successGPS(position) {

  if (!isProcessing) return;

  const latitude =
    position.coords.latitude;

  const longitude =
    position.coords.longitude;

  const accuracy =
    position.coords.accuracy;


  // Reject inaccurate readings
  if (accuracy > MAX_GPS_ACCURACY) {

    showMessage(
      "Improving GPS accuracy... Current accuracy: " +
      accuracy.toFixed(1) +
      " meters. Required: 5 meters or better.",
      "progress"
    );

    return;

  }


  // Stop GPS collection after acceptable reading
  stopGPS();

  showMessage(
    "GPS accuracy achieved. Checking patrol checkpoint...",
    "progress"
  );


  // Send GPS to Google Apps Script
  verifyCheckpoint(
    latitude,
    longitude,
    accuracy
  );

}


// ======================================
// GPS ERROR
// ======================================

function gpsError(error) {

  if (!isProcessing) return;

  let message;

  switch (error.code) {

    case error.PERMISSION_DENIED:

      message =
        "Location permission denied. Please enable GPS access.";

      break;

    case error.POSITION_UNAVAILABLE:

      message =
        "GPS signal unavailable. Please try again outdoors.";

      break;

    case error.TIMEOUT:

      message =
        "GPS request timed out. Please try again.";

      break;

    default:

      message =
        "Unable to retrieve GPS location.";

  }

  resetSystem();

  showMessage(message, "error");

}


// ======================================
// GOOGLE APPS SCRIPT CONNECTION
// ======================================

function verifyCheckpoint(
  latitude,
  longitude,
  accuracy
) {

  const callbackName =
    "handleLocationResponse";

  window[callbackName] = function(data) {

    cleanupAPI();

    isProcessing = false;

    button.disabled = false;

    displayResult(data);

  };


  const params = new URLSearchParams({

    latitude: latitude,

    longitude: longitude,

    accuracy: accuracy,

    callback: callbackName

  });


  const script = document.createElement("script");

  activeScript = script;

  script.src =
    GOOGLE_WEB_APP_URL +
    "?" +
    params.toString();


  script.onerror = function() {

    cleanupAPI();

    isProcessing = false;

    button.disabled = false;

    showMessage(
      "Could not connect to Google Apps Script. Check your deployment URL and access settings.",
      "error"
    );

  };


  apiTimer = setTimeout(function() {

    cleanupAPI();

    isProcessing = false;

    button.disabled = false;

    showMessage(
      "Google Apps Script request timed out. Please try again.",
      "error"
    );

  }, 20000);


  document.body.appendChild(script);

}


// ======================================
// DISPLAY VERIFICATION RESULT
// ======================================

function displayResult(data) {

  output.replaceChildren();

  if (!data || !data.success) {

    showMessage(
      "Verification error: " +
      (data?.error || "Invalid server response"),
      "error"
    );

    return;

  }


  if (data.verified) {

    const title = document.createElement("div");

    title.className = "success";

    title.textContent =
      "✓ CHECKPOINT VERIFIED";


    const label = document.createElement("div");

    label.textContent =
      "Verified Form Code";


    const code = document.createElement("div");

    code.className = "form-code";

    code.textContent =
      data.formCode;


    const details = document.createElement("div");

    details.className = "details";

    details.textContent =
      "Distance: " +
      data.distanceMeters.toFixed(2) +
      " meters | GPS accuracy: " +
      data.gpsAccuracyMeters.toFixed(1) +
      " meters";


    output.append(
      title,
      label,
      code,
      details
    );

  } else {

    const title = document.createElement("div");

    title.className = "error";

    title.textContent =
      "✕ CHECKPOINT NOT VERIFIED";


    const details = document.createElement("div");

    details.className = "details";

    details.textContent =
      "Nearest checkpoint: " +
      data.closestFormCode +
      " | Distance: " +
      data.distanceMeters.toFixed(2) +
      " meters. Required: 5 meters or less.";


    output.append(title, details);

  }

}


// ======================================
// BUTTON
// ======================================

button.addEventListener(
  "click",
  detectLocation
);

</script>

</body>
</html>
