
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Location Form Code Detector</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .container {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h2 {
      color: #202124;
      margin-top: 0;
    }

    p {
      color: #666;
      line-height: 1.5;
    }

    button {
      background: #188038;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 15px 25px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      margin-top: 15px;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #output {
      margin-top: 25px;
      padding: 15px;
      border-radius: 8px;
      background: #f8f9fa;
      overflow-wrap: anywhere;
    }

    .success {
      color: #188038;
      font-weight: bold;
      font-size: 20px;
    }

    .error {
      color: #d93025;
      font-weight: bold;
    }

    .code {
      font-size: 30px;
      font-weight: bold;
      color: #188038;
      margin: 12px 0;
    }

    .details {
      font-size: 14px;
      color: #666;
      line-height: 1.8;
    }
  </style>
</head>

<body>

  <div class="container">

    <h2>Location Detection</h2>

    <p>
      Press the button below to detect your nearest
      registered form code.
    </p>

    <button id="location-btn" onclick="detectLocation()">
      📍 Detect My Location
    </button>

    <div id="output" aria-live="polite">
      Press the button to start.
    </div>

  </div>

  <script>

    const button = document.getElementById("location-btn");
    const output = document.getElementById("output");

    // Search radius in meters
    const SEARCH_RADIUS = 50;

    function showMessage(message, className = "") {
      output.className = "";
      output.replaceChildren();

      const element = document.createElement("div");
      element.className = className;
      element.textContent = message;

      output.appendChild(element);
    }

    function detectLocation() {

      if (!navigator.geolocation) {
        showMessage(
          "Your browser does not support GPS location.",
          "error"
        );
        return;
      }

      button.disabled = true;
      showMessage("Getting your current location...");

      const options = {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 0
      };

      navigator.geolocation.getCurrentPosition(
        successCallback,
        failureCallback,
        options
      );
    }

    // GPS location successfully retrieved
    function successCallback(position) {

      const latitude = position.coords.latitude;
      const longitude = position.coords.longitude;

      showMessage("Checking nearest form code...");

      google.script.run
        .withSuccessHandler(displayResult)
        .withFailureHandler(handleServerError)
        .getNearestForm(
          latitude,
          longitude,
          SEARCH_RADIUS
        );
    }

    // Display server response
    function displayResult(data) {

      button.disabled = false;
      output.replaceChildren();

      if (!data || !data.success) {
        showMessage("Invalid server response.", "error");
        return;
      }

      if (data.isWithinRange) {

        const title = document.createElement("div");
        title.className = "success";
        title.textContent = "✓ Match Verified!";

        const label = document.createElement("div");
        label.textContent = "Assigned Form Code:";

        const code = document.createElement("div");
        code.className = "code";
        code.textContent = data.matchedForm;

        const details = document.createElement("div");
        details.className = "details";
        details.textContent =
          "Distance: " + data.closestDistanceMeters +
          " meters | Allowed radius: " +
          data.thresholdMeters + " meters";

        output.append(title, label, code, details);

      } else {

        const title = document.createElement("div");
        title.className = "error";
        title.textContent = "Outside Allowed Range";

        const details = document.createElement("div");
        details.className = "details";

        details.textContent =
          "Closest form: " + data.closestForm +
          " | Distance: " + data.closestDistanceMeters +
          " meters | Allowed radius: " +
          data.thresholdMeters + " meters";

        output.append(title, details);
      }
    }

    // Google Apps Script error
    function handleServerError(error) {

      button.disabled = false;

      showMessage(
        "Server Error: " + error.message,
        "error"
      );
    }

    // GPS errors
    function failureCallback(error) {

      button.disabled = false;

      let message = "Unable to retrieve your location.";

      switch (error.code) {

        case error.PERMISSION_DENIED:
          message =
            "Location access denied. Please allow location permission.";
          break;

        case error.POSITION_UNAVAILABLE:
          message =
            "Your current GPS location is unavailable.";
          break;

        case error.TIMEOUT:
          message =
            "Location request timed out. Please try again.";
          break;
      }

      showMessage(message, "error");
    }

  </script>

</body>
</html>
