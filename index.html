<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    
    <body>

        <button id="location-btn">Location</button>

        <div id="output">Press the button to detect your closest form code.</div>

        <script>

            const button = document.getElementById("location-btn");

            const output = document.getElementById("output");

            const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbybUHXglg1HXltgOF3AA0S-hlBxeE7H48zqKmGS-q-J2ZCCPP3MS0aEFjHYdCNzfTRc/exec";

            // Handles successful retrieval of location
            async function successCallback(position) {
                const payload = {
                    latitude: position.coords.latitude,
                    longitude: position.coords.longitude
                };

                output.textContent = "Connecting to Google Cloud Secure Engine...";

                try {
                    // Submit coordinates safely via POST
                    const response = await fetch(GOOGLE_WEB_APP_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain' }, // Avoid CORS trigger issues with Apps Script
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) throw new Error("Cloud network error.");

                    const data = await response.json();

                    if(data.error) {
                        throw new Error(data.error);
                    }

                    output.innerHTML = `
                        <span style="color: #0f9d58; font-weight: bold; font-size: 1.3rem;">Match Verified!</span><br><br>
                        <strong>Form Code Assigned:</strong> ${data.formCode}<br>
                        <small style="color: #777;">Proximity: ${data.distance.toFixed(2)} km</small>
                    `;
                } catch (err) {
                    output.innerHTML = `<span style="color: red;">Error processing location matching:</span><br>${err.message}`;
                } finally {
                    button.disabled = false;
                }
            }

            // Handles user denial or technical issues
            function failureCallback(error) {
                button.disabled = false;
                if (error.code === error.PERMISSION_DENIED) {
                    output.textContent = "Access denied. Please check your browser location configurations.";
                } else {
                    output.textContent = `GPS Sensor Error: ${error.message}`;
                }
            }

            button.addEventListener("click", () => {
                // 1. Check if the browser supports the Geolocation API
                if (!navigator.geolocation) {
                    output.textContent = "Geolocation is not supported by your browser.";
                    return;
                }

                button.disabled = true;
                output.textContent = "Locating...";

                // Configuration settings
                const geoOptions = {
                    enableHighAccuracy: true, // Forces device to use GPS if available (slower/uses more battery)
                    timeout: 10000,            // Give up after 5 seconds
                    maximumAge: 0             // Do not use a cached position; get a fresh one
                };
                // 2. Request the current position
                navigator.geolocation.getCurrentPosition(successCallback, failureCallback, geoOptions);
            });

        </script>

    </body>

</html>
