<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    
    <body>

        <button id="location-btn">Location</button>

        <div id="output">Press the button to detect your closest form code.</div>

        <script>

            const button = document.getElementById("location-btn");

            const output = document.getElementById("output");

            const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbybUHXglg1HXltgOF3AA0S-hlBxeE7H48zqKmGS-q-J2ZCCPP3MS0aEFjHYdCNzfTRc/exec";

            // Handles successful retrieval of location
            async function successCallback(position) {
                const payload = {
                    latitude: position.coords.latitude,
                    longitude: position.coords.longitude,
                    radiusMeters: 10 // Explicitly requests a 10-meter radius
                };

                output.innerHTML = `Device Lat: ${payload.latitude}<br>Device Lng: ${payload.longitude}<br>Accuracy: ±${Math.round(position.coords.accuracy)}m<br>Checking...`;

                try {
                    const response = await fetch(GOOGLE_WEB_APP_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify(payload)
                    });

                    const data = await response.json();
                    if (data.error) throw new Error(data.error);

                    let breakdown = data.candidates ? data.candidates.map(c =>
                        `${c.formCode}: ${c.distanceMeters}m away`
                    ).join("<br>") : "";

                    if (data.isWithinRange) {
                        output.innerHTML = `
                            MATCH VERIFIED (Within 10m)<br>
                            Form: ${data.matchedForm}<br>
                            Distance: ${data.closestDistanceMeters}m<br><br>
                            All Checkpoints:<br>${breakdown}`;
                    } else {
                        output.innerHTML = `
                            OUT OF RANGE (>10m)<br>
                            Closest: ${data.closestForm} (${data.closestDistanceMeters}m away)<br>
                            Required: Within ${data.thresholdMeters}m<br><br>
                            All Checkpoints:<br>${breakdown}`;
                    }
                } catch (err) {
                    output.innerHTML = `Error: ${err.message}`;
                } finally {
                    button.disabled = false;
                }
            }

            // Handles user denial or technical issues
            function failureCallback(error) {
                button.disabled = false;
                if (error.code === error.PERMISSION_DENIED) {
                    output.textContent = "Access denied. Please check your browser location configurations.";
                } else {
                    output.textContent = `GPS Sensor Error: ${error.message}`;
                }
            }

            button.addEventListener("click", () => {
                // 1. Check if the browser supports the Geolocation API
                if (!navigator.geolocation) {
                    output.textContent = "Geolocation is not supported by your browser.";
                    return;
                }

                button.disabled = true;
                output.textContent = "Locating...";

                // Configuration settings
                const geoOptions = {
                    enableHighAccuracy: true, // Forces device to use GPS if available (slower/uses more battery)
                    timeout: 10000,            // Give up after 5 seconds
                    maximumAge: 0             // Do not use a cached position; get a fresh one
                };
                // 2. Request the current position
                navigator.geolocation.getCurrentPosition(successCallback, failureCallback, geoOptions);
            });

        </script>

    </body>

</html>
